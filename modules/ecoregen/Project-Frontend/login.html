<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Page</title>
    <!-- Boxicons CDN for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' />
    <style>
        :root {
            --primary-color: #FFD700;
            --secondary-color: #FFEB3B;
            --black: #000000;
            --white: #ffffff;
            --gray: #efefef;
            --gray-2: #757575;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap');

        * {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100vh;
            overflow: hidden;
            background-color: var(--black);
        }

        .container {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            height: 100vh;
        }

        .col {
            width: 50%;
        }

        .align-items-center {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .form-wrapper {
            width: 100%;
            max-width: 28rem;
        }

        .form {
            padding: 1rem;
            background-color: var(--black);
            border-radius: 1.5rem;
            width: 100%;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            transform: scale(0);
            transition: .5s ease-in-out;
            transition-delay: 1s;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin: 1rem 0;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            font-size: 1.4rem;
            color: var(--gray-2);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 1rem 3rem;
            font-size: 1rem;
            background-color: var(--gray);
            border-radius: .5rem;
            border: 0.125rem solid var(--white);
            outline: none;
            color: var(--black);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .input-group input:focus,
        .input-group select:focus {
            border: 0.125rem solid var(--primary-color);
        }

        .form button {
            cursor: pointer;
            width: 100%;
            padding: .6rem 0;
            border-radius: .5rem;
            border: none;
            background-color: var(--primary-color);
            color: var(--black);
            font-size: 1.2rem;
            outline: none;
        }

        .form p {
            margin: 1rem 0;
            font-size: .7rem;
            color: var(--white);
        }

        .flex-col {
            flex-direction: column;
        }

        .pointer {
            cursor: pointer;
        }

        .container.sign-in .form.sign-in,
        .container.sign-in .social-list.sign-in,
        .container.sign-in .social-list.sign-in>div,
        .container.sign-up .form.sign-up,
        .container.sign-up .social-list.sign-up,
        .container.sign-up .social-list.sign-up>div {
            transform: scale(1);
        }

        .content-row {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 6;
            width: 100%;
        }

        .text {
            margin: 4rem;
            color: var(--white);
        }
        
        .text.sign-in {
            color: black !important;
        }
        
        .text.sign-up {
            color: black !important;
        }

        .text h2 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 2rem 0;
            transition: 1s ease-in-out;
        }

        .text p {
            font-weight: 600;
            transition: 1s ease-in-out;
            transition-delay: .2s;
        }

        .img img {
            width: 30vw;
            transition: 1s ease-in-out;
            transition-delay: .4s;
        }

        .text.sign-in h2,
        .text.sign-in p,
        .img.sign-in img {
            transform: translateX(-250%);
        }

        .text.sign-up h2,
        .text.sign-up p,
        .img.sign-up img {
            transform: translateX(250%);
        }

        .container.sign-in .text.sign-in h2,
        .container.sign-in .text.sign-in p,
        .container.sign-in .img.sign-in img,
        .container.sign-up .text.sign-up h2,
        .container.sign-up .text.sign-up p,
        .container.sign-up .img.sign-up img {
            transform: translateX(0);
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            height: 100vh;
            width: 300vw;
            transform: translate(35%, 0);
            background-image: linear-gradient(-45deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            transition: 1s ease-in-out;
            z-index: 6;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            border-bottom-right-radius: max(50vw, 50vh);
            border-top-left-radius: max(50vw, 50vh);
        }

        .container.sign-in::before {
            transform: translate(0, 0);
            right: 50%;
        }

        .container.sign-up::before {
            transform: translate(100%, 0);
            right: 50%;
        }
        .error{
        color: red;

        }
    </style>
</head>

<body>
    <div id="container" class="container">
        <div class="row">
            <!-- SIGN UP -->
            <div class="col align-items-center flex-col sign-up">
                <div class="form-wrapper align-items-center">
                    <div class="form sign-up">
                        <form id="registerForm" method="POST">
                            <!-- <div class="input-group">
                                <i class='bx bxs-user'></i>
                                <input type="text" name="username" placeholder="Username" required />
                            </div> -->
                            <div class="input-group">
                                <i class='bx bx-mail-send'></i>
                                <input type="email" name="email" id="registerEmail" placeholder="Email" required />
                            </div>
                            <div class="input-group">
                                <i class='bx bxs-lock-alt'></i>
                                <input type="password" name="password" id="registerPassword" placeholder="Password"
                                    required />
                            </div>
                            <!-- <div class="input-group">
                                <i class='bx bxs-lock-alt'></i>
                                <input type="password" name="confirm_password" placeholder="Confirm Password" required />
                            </div> -->
                            <div class="input-group">
                                <i class='bx bx-user-pin'></i>
                                <select name="role" id="role" required>
                                    <option value="" disabled selected>Select Role</option>
                                    <option value="FOOD_WASTE_GENERATOR">Food Waste Generator</option>
                                    <option value="BIOGAS_COMPANY">Biogas Company</option>
                                </select>
                            </div>
                            <div id="registerError" class="error"></div>
                            <button type="submit">Sign up</button>
                            <p>
                                <span>Already have an account?</span>
                                <b onclick="toggle()" class="pointer">Sign in here</b>
                            </p>
                        </form>
                    </div>
                </div>
            </div>

            <!-- SIGN IN -->
            <div class="col align-items-center flex-col sign-in">
                <div class="form-wrapper align-items-center">
                    <div class="form sign-in">
                        <form id="loginForm" method="POST">
                            <!-- <div class="input-group">
                                <i class='bx bxs-user'></i>
                                <input type="text" name="username" placeholder="Username" required />
                            </div> -->
                            <div class="input-group">
                                <i class='bx bx-mail-send'></i>
                                <input type="email" name="email" id="loginEmail" placeholder="Email" required />
                            </div>
                            <div class="input-group">
                                <i class='bx bxs-lock-alt'></i>
                                <input type="password" name="password" id="loginPassword" placeholder="Password"
                                    required />
                            </div>
                            <!-- <div class="input-group">
                                <i class='bx bx-user-pin'></i>
                                <select name="role" required>
                                    <option value="" disabled selected>Select Role</option>
                                    <option value="restaurant">Restaurant Owner</option>
                                    <option value="biogas">Biogas Plant Owner</option>
                                </select>
                            </div> -->
                            <div id="loginError" class="error"></div>
                            <button type="submit">Sign in</button>
                            <p><b>Forgot password?</b></p>
                            <p>
                                <span>Don't have an account?</span>
                                <b onclick="toggle()" class="pointer">Sign up here</b>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="row content-row">
            <div class="col align-items-center flex-col">
                <div class="text sign-in">
                    <h2>Welcome Back!</h2>
                    <p>Log in with your personal info</p>
                </div>
                <!-- <div class="img sign-in">
                    <img src="login.svg" alt="login" />
                </div> -->
            </div>
            <div class="col align-items-center flex-col">
                <div class="text sign-up">
                    <h2>Join Us!</h2>
                    <p>Create your account to get started</p>
                </div>
                <!-- <div class="img sign-up">
                    <img src="signup.svg" alt="signup" />
                </div> -->
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');

        function toggle() {
            if (container.classList.contains('sign-in')) {
                container.classList.remove('sign-in');
                container.classList.add('sign-up');
            } else {
                container.classList.remove('sign-up');
                container.classList.add('sign-in');
            }
        }

        // Set default view to sign-in
        container.classList.add('sign-in');
        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('role').value;
            const registerError = document.getElementById('registerError');
            registerError.textContent = ''; // Clear previous errors

            try {
                const response = await fetch('http://localhost:8080/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });
                console.log("user:", email, password, role);

                if (response.ok) {
                    alert("Registration successful! Please login.");
                    // document.getElementById('register-form').classList.add('hidden');
                    // document.getElementById('login-form').classList.remove('hidden');
                } else {
                    const errorData = await response.json();
                    registerError.textContent = errorData.message || 'Registration failed. Please try again.';
                }
            } catch (error) {
                registerError.textContent = 'Network error. Please try again later.' + error;
            }
        });

        // Login logic with error handling
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginError = document.getElementById('loginError');
            loginError.textContent = ''; // Clear previous errors

            try {
                const response = await fetch('http://localhost:8080/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    const token = data.jwt;  // Assuming the JWT is sent as "token"
                    localStorage.setItem('jwt', token);  // Save token to localStorage

                    const userRole = data.role;  // Assuming the role is part of the login response

                    // Redirect based on the role
                    if (data.role === 'FOOD_WASTE_GENERATOR') {
                        window.location.href = 'foodDashboard.html';  // Adjust URL as needed
                    } else if (data.role === 'BIOGAS_COMPANY') {
                        window.location.href = "cmpDashboard.html";  // Adjust URL as needed
                    } else {
                        window.location.href = "login.html";  // Default fallback
                    }
                } else {
                    const errorData = await response.json();
                    loginError.textContent = errorData.message || 'Login failed. Please check your credentials.';
                }
            } catch (error) {
                loginError.textContent = 'Network error. Please try again later.';
            }
        });
    </script>
</body>

</html>
